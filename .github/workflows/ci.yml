name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  typecheck-and-test:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: npm ci

      - name: Build @openpcb/* dists
        run: |
          set -euo pipefail
          for pkg in kicad-parsers rendering-core kicad-import step-to-glb r3f-eda-canvas opclib-pack command-pattern contracts; do
            dir="node_modules/@openpcb/$pkg"
            if [ -d "$dir" ] && [ -f "$dir/tsconfig.build.json" ]; then
              echo "::group::rebuild @openpcb/$pkg"
              (cd "$dir" && npx --no-install tsc -p tsconfig.build.json) || (cd "$dir" && npx tsc -p tsconfig.build.json)
              echo "::endgroup::"
            fi
          done

      - name: Fetch CoreLibrary (for backend tests that boot the library module)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/fetch-core-library.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Codegen drift check
        run: npm run gen:check

      - name: Contract codegen drift check
        run: npm run gen:contracts -- --check

      - name: Backend tests (Bun)
        run: npm run test:backend

      - name: Frontend tests (Vitest)
        run: npm run test:react

      # The DRC worker is a separate tsup bundle Electron spawns as a file; the
      # smoke runs the BUILT bundle on Node and compares its report byte for
      # byte with the in-thread engine (docs/pcb-hardening/09-execution-contract.md §8).
      - name: DRC worker bundle smoke (Electron build)
        run: npm run test:drc-worker-smoke

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: npm ci

      - name: Build @openpcb/* dists
        run: |
          set -euo pipefail
          for pkg in kicad-parsers rendering-core kicad-import step-to-glb r3f-eda-canvas opclib-pack command-pattern contracts; do
            dir="node_modules/@openpcb/$pkg"
            if [ -d "$dir" ] && [ -f "$dir/tsconfig.build.json" ]; then
              (cd "$dir" && npx --no-install tsc -p tsconfig.build.json) || (cd "$dir" && npx tsc -p tsconfig.build.json)
            fi
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
